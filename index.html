<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Artem Messenger</title><link rel="stylesheet" href="style.css"></head><body><div id="login" class="login"><div class="login-card"><div class="logo">✦</div><h1>Artem Messenger</h1><p>Твой веб-мессенджер</p><input id="name" maxlength="24" placeholder="Введите имя"><button id="loginBtn">Войти</button></div></div><div id="app" class="app hidden"><aside><div class="brand">✦ <b>Messenger</b></div><div class="me"><div id="myAvatar" class="avatar">?</div><div><b id="myName"></b><small>В сети</small></div></div><div class="search">⌕ <input id="search" placeholder="Поиск"></div><div class="label">ЧАТЫ</div><button class="chat active"><div class="avatar">🌐</div><div><b>Общий чат</b><small>Локальный чат</small></div></button><div class="hint">Сообщения сохраняются в этом браузере.</div></aside><main><header><div class="avatar">🌐</div><div><b>Общий чат</b><small>Твой личный демо-мессенджер</small></div><button id="theme">☾</button></header><section id="messages"></section><form id="form"><label class="attach">📎<input id="image" type="file" accept="image/*"></label><input id="text" placeholder="Написать сообщение..." autocomplete="off"><button>➤</button></form></main></div><script src="app.js"></script></body></html>
